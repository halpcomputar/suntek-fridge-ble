name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # HACS and hassfest rules move independently of this repo; catch breakage early.
    - cron: "0 6 * * 1"

jobs:
  tests:
    name: Protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: python -m pytest tests/ -q

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Skipped, not satisfied: HACS wants brand assets committed under
          # custom_components/suntek_fridge_ble/brand/ or an entry in the
          # home-assistant/brands repository. Neither exists yet. This only gates
          # eligibility for the HACS default store — installing from a custom
          # repository works regardless. Drop this line once brands are sorted.
          ignore: brands
